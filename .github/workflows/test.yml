name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Check protected data and cleanup behavior with isolated fixtures
        shell: ${{ matrix.shell }}
        run: ./windows-cache-cleanup.test.ps1
